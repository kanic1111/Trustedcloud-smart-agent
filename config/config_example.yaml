# 雲平台 api url
trusted_cloud_url: 'http://kong.127.0.0.1.nip.io/' 

# image 連 API 用 IP 設定
server:
  # host_ip: ${VM_HOST}
  host_ip: 127.0.0.1
  port: 8081  # TODO 如果沒有值 使用https://(HOST_IP)/images
#  image_base_url: "http://140.110.160.164:8005/images"

# Qdrant 設定
qdrant:
  host_ip: 10.98.249.152   # 或 VM IP, FIP
  port: 6333

# Ollama 設定
ollama:
  host_ip: 127.0.0.1    # 或 VM IP, FIP
  port: 30022


# llm 基本 url、model_name
# "http://140.110.160.97:30002/v1"
# "ollama"
# "llama4-scout"
# Agent LLM 
openai_base_url: "http://127.0.0.1:30002/v1"
api_key : "ollama"
llm_model_name : "gpt-oss:20b"
# Q&A LLM
openai_base_url_llm: "http://127.0.0.1:30002/v1"
api_key_llm : "ollama"
llm_model_name_llm : "RedHatAI/Llama-4-Scout-17B-16E-Instruct-FP8-dynamic"

# 預設 prompt 目前預設是 basic, 共有 basic , structured, article_qa, k8s_instruction 三總
prompt_style: "k8s_instruction"

# reranker 一次輸出數量
reranker_top: 2

# Qdrant name 機敏雲、可信賴雲
SensiMesh_Qdrant_vector_collection_name: "SensiMesh_20250519_512_10_bge-m3"
trusted_cloud_Qdrant_vector_collection_name: "trusted-cloudEN_20250923_512_10_bge-m3"
qdrant_ip: "10.98.249.152"
#ollama_ip: "10.106.185.217"
ollama_ip: "127.0.0.1"
# embed_model name 
embed_model_name: "qllama/bge-large-en-v1.5:latest"

# 預設溫度參數
temperature: 0.1
